<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Liv Demo — Web Onboarding</title>
  <meta name="description" content="Watch the Liv web onboarding experience — get started in seconds from your browser.">
  <meta property="og:title" content="Liv Demo — Web Onboarding">
  <meta property="og:description" content="Get started with Liv in seconds — a seamless web onboarding experience.">
  <meta property="og:type" content="video.other">
  <meta property="og:url" content="https://hello.liv4all.com/demo/web-onboarding">
  <meta property="og:image" content="https://hello.liv4all.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Liv — Less Admin. More Living.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://hello.liv4all.com/og-image.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖤</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface-glass: rgba(18, 18, 26, 0.6);
      --border: #1e1e2e;
      --border-light: rgba(255, 255, 255, 0.06);
      --text: #e0e0e8;
      --text-dim: #7a7a8e;
      --accent: #8b5cf6;
      --accent-glow: rgba(139, 92, 246, 0.15);
      --radius: 16px;
      --radius-lg: 24px;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .player-container {
      width: min(640px, 100%);
      text-align: center;
      background: var(--surface-glass);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border-light);
      border-radius: var(--radius-lg);
      padding: 20px;
    }
    .player-container video {
      width: 100%;
      border-radius: var(--radius);
      border: 1px solid var(--border-light);
      background: var(--surface);
    }
    .player-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.2rem;
      font-weight: 600;
      margin-top: 20px;
      margin-bottom: 8px;
    }
    .player-desc {
      font-size: 0.9rem;
      color: var(--text-dim);
      max-width: 480px;
      margin: 0 auto 24px;
    }
    .back-link {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      color: var(--accent);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: color 0.2s;
    }
    .back-link:hover { text-decoration: underline; }

    .fade-in {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="player-container fade-in">
    <video src="../assets/videos/web-onboarding-demo.mp4" controls playsinline preload="metadata"></video>
    <h1 class="player-title">web onboarding</h1>
    <p class="player-desc">get started with liv in seconds — a seamless onboarding experience right from your browser.</p>
    <a href="/" class="back-link">← hello.liv4all.com</a>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      document.querySelectorAll('.fade-in').forEach(el => {
        new IntersectionObserver(([e]) => { if (e.isIntersecting) { e.target.classList.add('visible'); } }, { threshold: 0.1 }).observe(el);
      });
    });
  </script>

  <script src="https://app.liv4all.com/embed/chat.js" async></script>
</body>
</html>
